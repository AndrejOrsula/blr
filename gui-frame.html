<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Blender GUI runtime</title>
  <style>
    :root, html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #202124; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; color: #eee; font: 14px system-ui, sans-serif; pointer-events: none; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Blender interactive workspace"></canvas>
  <div id="status">Loading Blender GUI…</div>
  <script type="module" src="./gui-frame.js?blr_app=e2a62bff4571b535bf49f8c5ef61b635947d79f33e7cf6e17d4d5c5fd7887e4b"></script>
</body>
</html>
